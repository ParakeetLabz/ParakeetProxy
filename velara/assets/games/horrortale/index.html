        body {

            align-items: center;

            height: 100vh;

        }
        #status {
            display: flex;
            flex-direction: column;

            text-align: center;
            padding: 1.5rem;
            max-width: 92vw;
        }
        .loading-logo {
            margin-bottom: 1rem;

        .loading-logo img {
            height: 280px;
            width: auto;
            max-width: 90vw;
            display: block;
            object-fit: contain;
            opacity: 0.97;
            filter: drop-shadow(0 8px 32px rgba(0,0,0,0.45));

        #msg {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.8;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }
        .bar-bg {
            width: 100%;
            max-width: 440px;
            background: rgba(255,255,255,0.14);
            height: 6px;
            border-radius: 6px;
            overflow: hidden;
        }
        #bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 100%);
            border-radius: 6px;
            transition: width 0.35s ease-out;
            box-shadow: 0 0 12px rgba(255,255,255,0.25);
        }
        #unity-canvas {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: #000;
            display: none;
        }
        #unity-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: none;
        }

    <script>
        var canvas = document.getElementById("unity-canvas");
        const game = "horrortale";
        
        let chunksMetadata = null;
        const chunkCache = new Map();
        
        async function loadChunksMetadata() {
            try {
                const response = await fetch('/Build/chunks-metadata.json?game=' + game);
                chunksMetadata = await response.json();
            } catch (e) {
                console.warn('Could not load chunks metadata, using original files');
            }
        }
        
        async function loadFileFromChunks(filename, onProgress) {
            if (!chunksMetadata || !chunksMetadata[filename]) {
                return '/Build/' + filename + '?game=' + game;
            }
            
            if (chunkCache.has(filename)) {
                return chunkCache.get(filename);
            }
            
            const metadata = chunksMetadata[filename];
            const totalChunks = metadata.chunks.length;
            let loadedChunksCount = 0;
            
            const chunkPromises = metadata.chunks.map((chunkName, index) => {
                return fetch(`/Build/chunks/${chunkName}?game=${game}`)
                    .then(response => response.arrayBuffer())
                    .then(buffer => {
                        loadedChunksCount++;
                        if (onProgress) {
                            onProgress(loadedChunksCount / totalChunks);
                        }
                        return { index, buffer };
                    });
            });
            
            const loadedChunks = await Promise.all(chunkPromises);
            
            loadedChunks.sort((a, b) => a.index - b.index);
            const totalSize = loadedChunks.reduce((sum, chunk) => sum + chunk.buffer.byteLength, 0);
            const combined = new Uint8Array(totalSize);
            
            let offset = 0;
            for (const chunk of loadedChunks) {
                combined.set(new Uint8Array(chunk.buffer), offset);
                offset += chunk.buffer.byteLength;
            }
            
            const blob = new Blob([combined]);
            const blobUrl = URL.createObjectURL(blob);
            
            chunkCache.set(filename, blobUrl);
            
            return blobUrl;
        }
        
        async function initializeUnity() {
            await loadChunksMetadata();
            
            const originalFetch = window.fetch;
            window.fetch = function(url, ...args) {
                if (chunksMetadata && typeof url === 'string') {
                    const filename = url.split('/').pop();
                    if (chunksMetadata[filename]) {
                        return loadFileFromChunks(filename).then(blobUrl => {
                            return originalFetch(blobUrl, ...args);
                        });
                    }
                }
                return originalFetch.apply(this, arguments);
            };
            
            console.log('Loading game files from chunks...');
            
            const bar = document.getElementById('bar');
            const msg = document.getElementById('msg');
            
            const [dataUrl, frameworkUrl, codeUrl] = await Promise.all([
                loadFileFromChunks('728121e7c659be57f9f9e2176c5a8e6f.data.br', (progress) => {
                    if (bar) bar.style.width = (progress * 50) + '%';
                    if (msg) msg.innerText = `Fetching Content ${Math.floor(progress * 100)}%`;
                }),
                loadFileFromChunks('e3d224c7579ce482432b81cb09f2d68e.framework.js.br', (progress) => {
                }),
                loadFileFromChunks('64abbec2f88a03563b717f5964ff9276.wasm.br', (progress) => {
                    if (bar) bar.style.width = (50 + (progress * 35)) + '%';
                    if (msg) msg.innerText = `Fetching Core ${Math.floor(progress * 100)}%`;
                })
            ]);
            
            console.log('All chunks loaded');
            
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: frameworkUrl,
                codeUrl: codeUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: "UnityGame",
                productVersion: "1.4.17",
            };

            var script = document.createElement("script");
            script.src = "/Build/bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js?game=" + game; 
            script.onload = () => {
                const origCreate = window.createUnityInstance;
                window.createUnityInstance = function(canvas, config, onProgress) {
                    return origCreate(canvas, config, onProgress).then((instance) => {
                        window.unityInstance = instance;
                        window.Module = instance.Module;
                        
                        const m = instance.Module;
                        if (m) {
                            m.print = () => {};
                            m.printErr = () => {};
                            m.logError = () => {};
                        }
                        
                        try {
                            instance.SendMessage("CrazySDKSingleton", "JSLibCallback_Init");
                        } catch(e) {}
                        
                        return instance;
                    });
                };
                
                createUnityInstance(canvas, config, (p) => {
                    if (bar) bar.style.width = (85 + (p * 15)) + '%';
                    if (msg) msg.innerText = 'Launching ' + Math.floor(p * 100) + '%';
                }).then(() => {
                    document.getElementById('status').style.display = 'none';
                    document.getElementById('unity-canvas').style.display = 'block';
                }).catch((err) => {
                });
            };
            document.body.appendChild(script);
        }
        
        initializeUnity();
    </script>
