<!DOCTYPE html>
<html>
  <head>
    
    
    
    

    <base href="https://rawcdn.githack.com/genizy/assets/main/madalin-stunt-cars-3/">
    <title>Madalin Stunt Cars 3</title>
  <!-- Google tag (gtag.js) -->



<script>
(() => {
  const loadScript = (src) =>
    new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.async = false;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("Failed to load " + src));
      (document.head || document.documentElement).appendChild(s);
    });
  const origin = window.location.origin;
  loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js")
    .then(() => loadScript(origin + "/js/auth.js"))
    .then(() => loadScript(origin + "/js/cloud-save-unity.js"))
    .catch((err) => console.warn("Cloud save bootstrap failed:", err));
})();
</script>
</head>
  <link rel="icon" type="image/x-icon" href="img/index.jpg" />
  <link rel="stylesheet" href="TemplateData/style.css" />
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="js/unityloader35.js"></script>
  <script src="/js/main.js"></script>
  <body>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "game.json", {
        onProgress: UnityProgress,
        Module: {
          onRuntimeInitialized: function () {
            UnityProgress(gameInstance, "complete");
          },
        },
      });
    </script>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 100%; height: 100%; margin: auto;"></div>
    </div>
  </body>
</html>
