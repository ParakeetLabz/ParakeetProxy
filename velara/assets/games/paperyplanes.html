  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <link rel="icon" type="image/x-icon" href="thumb.png" />
  <title>Papery Planes</title>

  <script>
    window.config = {
      loader: "unity",
      debug: false,
      maxRatio: 16 / 9,
      minRatio: 9 / 16,

      title: "Papery Planes",

      thumbnail: "thumb.png",
      numScreenshots: 4,

      unityWebglBuildUrl: "ppw.json",
      unityWebglLoaderUrl: "UnityLoader.2019.1.js",

      // **** Optional Settings ****
      fileSize: 12,
      loadingComments: ["Loading..."],
      cachedDecompressedFileSizes: {
        "ppw.wasm.framework.unityweb": 533280,

      },
    };

<!-- Google tag (gtag.js) -->



<script>
(() => {
  const loadScript = (src) =>
    new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.async = false;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("Failed to load " + src));
      (document.head || document.documentElement).appendChild(s);
    });
  const origin = window.location.origin;
  loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js")
    .then(() => loadScript(origin + "/js/auth.js"))
    .then(() => loadScript(origin + "/js/cloud-save-unity.js"))
    .catch((err) => console.warn("Cloud save bootstrap failed:", err));
})();
</script>
</head>
<body>
  <script src="master-loader.js"></script>
  <script src="/js/main.js"></script>
</body>
